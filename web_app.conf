server { 

    listen 80 default_server; 
   # listen 443 ssl;
    server_name localhost; 

   # SSL
  # ssl_certificate /home/sankale/localhost-ssl/localhost.crt;
  # ssl_certificate_key /home/sankale/localhost-ssl/localhost.key;

     

    # Frontend 

   root /var/www/shopping-app/dist; 
#    root /var/www/isms-frontend;

    index index.html; 

     

    # Frontend routes 

    location / { 

        try_files $uri /index.html; 

    } 

     

    # API requests - direct to Laravel 

    location /api { 

        root /var/www/online-shop/public; 

        try_files $uri $uri/ /index.php?$query_string; 

         

        # CORS Headers 

        add_header 'Access-Control-Allow-Origin' '*' always; 

        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT, PATCH' always; 

        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always; 

         

        # Handle preflight requests 

        if ($request_method = OPTIONS) { 

            add_header Content-Length 0; 

            add_header Content-Type text/plain; 

            return 204; 

        } 

         

        location ~ \.php$ { 

            fastcgi_pass unix:/run/php/php8.3-fpm.sock; 

            fastcgi_index index.php; 

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; 

            include fastcgi_params; 

        } 

    } 

     

    # Handle PHP files for Laravel 

    location ~ \.php$ { 

        root /var/www/online-shop/public; 

        fastcgi_pass unix:/run/php/php8.3-fpm.sock; 

        fastcgi_index index.php; 

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; 

        include fastcgi_params; 

    } 

     

    # Storage access 

    location /storage { 

        alias /var/www/online-shop/storage/app/public; 

    }     

 

    error_page 404 /index.html; 

    error_log /var/log/nginx/online_shop_error.log; 

    access_log /var/log/nginx/online_shop_access.log; 

} 
